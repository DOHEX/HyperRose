name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must use SemVer, for example v0.1.5 or v0.2.0-beta.1"
            exit 1
          fi

          tag_version="$(printf '%s' "$RELEASE_TAG" | sed 's/^v//')"
          tag_base_version="$(printf '%s' "$tag_version" | cut -d- -f1)"
          app_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$app_version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi

          if [ "$tag_base_version" != "$app_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match app versionName $app_version"
            exit 1
          fi

          echo "Release tag: $RELEASE_TAG"
          echo "App versionName: $app_version"

      - name: Run release checks before signing
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is not set"
              missing=1
            fi
          done

          [ "${missing}" -eq 0 ] || exit 1

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyperrose-release.keystore"
          chmod 600 "$RUNNER_TEMP/hyperrose-release.keystore"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hyperrose-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts

          apk_count="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$apk_count" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found $apk_count"
            exit 1
          fi

          apk_source="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)"
          apk="release-artifacts/HyperRose-$GITHUB_REF_NAME.apk"
          cp -v "$apk_source" "$apk"

          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp -v app/build/outputs/mapping/release/mapping.txt release-artifacts/mapping.txt
          fi

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "::error::Could not find Android apksigner"
            exit 1
          fi

          "$apksigner" verify --verbose "$apk"
          "$apksigner" verify --print-certs "$apk" | tee release-artifacts/SIGNING_CERTIFICATE.txt

          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperrose-release-${{ github.ref_name }}
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${GITHUB_REF_NAME}"
            release-artifacts/*
            --verify-tag
            --generate-notes
            --fail-on-no-commits
          )

          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            args+=(--prerelease)
            args+=(--latest=false) # 预发布版不标记为 Latest
          else
            args+=(--latest)     # 正式版本标记为 Latest
          fi

          gh release create "${args[@]}"
